<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#63b39e">
<link rel="icon" href="data:,">
<title>Duck Boat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="game" data-state="ready">
  <button type="button" id="water" aria-label="Hold to board ducks. Release to test the boat.">
    <canvas id="scene" aria-hidden="true"></canvas>
    <span class="cue" aria-hidden="true"><i class="touch-mark"></i><span>Touching</span></span>
    <span class="replay" aria-hidden="true"><i></i></span>
  </button>
  <output id="duckCount" aria-label="Ducks aboard" aria-live="off">2</output>
  <button type="button" id="sound" aria-label="Turn sound on" aria-pressed="false"><i class="note" aria-hidden="true"></i></button>
  <span class="sr" role="status" id="announce"></span>
</main>
<script src="scene.js"></script><script src="game.js"></script>
</body>
</html>
